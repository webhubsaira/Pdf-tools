name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc over JSDoc-typed modules)
        run: npm run typecheck

      - name: Run unit and UI tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Check the bundle stayed code-split
        run: |
          # The PDF engine must not be in the entry chunk, otherwise every legal page
          # downloads pdf-lib and pdf.js again.
          entry=$(ls dist/assets/main-*.js | head -n 1)
          size=$(stat -c%s "$entry")
          echo "entry chunk: $entry ($size bytes)"
          test "$size" -lt 200000 || { echo "Entry chunk is too large: did the PDF engine get statically imported again?"; exit 1; }
